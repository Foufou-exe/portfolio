<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Haut du visage { tourné 90° -->
  <path 
    id="brace-top"
    d="M 15 35
       Q 15 25 25 25
       L 42 25
       Q 50 25 50 15
       Q 50 25 58 25
       L 75 25
       Q 85 25 85 35"
    fill="none"
    stroke="currentColor"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Œil gauche -->
  <circle 
    id="eye-left"
    cx="38"
    cy="50"
    r="7"
    fill="white"
    stroke="currentColor"
    stroke-width="1"
  />
  
  <!-- Œil droit -->
  <circle 
    id="eye-right"
    cx="62"
    cy="50"
    r="7"
    fill="white"
    stroke="currentColor"
    stroke-width="1"
  />
  
  <!-- Bas du visage } tourné 90° (bouche) -->
  <path 
    id="brace-bottom"
    d="M 15 65
       Q 15 75 25 75
       L 42 75
       Q 50 75 50 85
       Q 50 75 58 75
       L 75 75
       Q 85 75 85 65"
    fill="none"
    stroke="currentColor"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>

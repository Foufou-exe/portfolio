<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Haut du visage { tourné 90° -->
  <path 
    id="brace-top"
    d="M 20 30
       Q 20 20 30 20
       L 42 20
       Q 50 20 50 12
       Q 50 20 58 20
       L 70 20
       Q 80 20 80 30"
    fill="none"
    stroke="currentColor"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Œil gauche -->
  <circle 
    id="eye-left"
    cx="38"
    cy="50"
    r="6"
    fill="currentColor"
  />
  
  <!-- Œil droit -->
  <circle 
    id="eye-right"
    cx="62"
    cy="50"
    r="6"
    fill="currentColor"
  />
  
  <!-- Bas du visage } tourné 90° (bouche) -->
  <path 
    id="brace-bottom"
    d="M 20 70
       Q 20 80 30 80
       L 42 80
       Q 50 80 50 88
       Q 50 80 58 80
       L 70 80
       Q 80 80 80 70"
    fill="none"
    stroke="currentColor"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
